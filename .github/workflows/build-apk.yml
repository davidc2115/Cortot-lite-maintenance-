name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        env:
          # run_number augmente à chaque run → MAJ installable sans désinstaller
          VC: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.9
          # base 10 + numéro de run Actions (ex. run 8 → versionCode 18)
          CODE=$((10 + VC))
          NAME="1.3.${VC}"
          echo "Building versionCode=$CODE versionName=$NAME"
          ./gradlew assembleDebug --no-daemon -PversionCode=$CODE -PversionName=$NAME
          # Affiche le fingerprint de signature pour contrôle
          keytool -printcert -jarfile app/build/outputs/apk/debug/*.apk 2>/dev/null | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: cortot-elite-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
